# Server Configuration
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskportal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mysqlsql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgdGhhdCBpcyBhdCBsZWFzdCA2NCBieXRlcyBsb25n}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI API Configuration (Anthropic Claude)
ai.api.url=https://api.anthropic.com/v1/messages
ai.api.key=${ANTHROPIC_API_KEY:your-api-key-here}
ai.api.model=claude-sonnet-4-20250514

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.taskportal=DEBUG
logging.level.org.springframework.security=INFO
